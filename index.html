<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大型二輪コース暗記ツール - ポータブル版</title>
<style>
  :root {
    --bg:#eef2f7;
    --panel:#ffffff;
    --ink:#111827;
    --muted:#6b7280;
    --line:#d1d5db;
    --soft:#f8fafc;
    --soft2:#f1f5f9;
    --accent:#dc2626;
    --blue:#2563eb;
    --blue-soft:#eff6ff;
    --ok:#16a34a;
    --warn:#f59e0b;
    --bad:#dc2626;
    --shadow:0 14px 34px rgba(15,23,42,.10);
    --shadow-soft:0 8px 18px rgba(15,23,42,.08);
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    margin:0;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:linear-gradient(180deg,#f8fafc 0%,var(--bg) 260px);
    color:var(--ink);
  }
  .app-header {
    max-width:1280px;
    margin:auto;
    padding:18px 20px 12px;
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(280px,420px);
    gap:16px;
    align-items:end;
  }
  .eyebrow {
    margin:0 0 4px;
    color:var(--blue);
    font-weight:900;
    letter-spacing:.08em;
    font-size:13px;
  }
  h1 { margin:0 0 8px; font-size:clamp(24px,3.1vw,38px); letter-spacing:.02em; line-height:1.16; }
  .sub { color:var(--muted); line-height:1.65; font-size:14px; }
  .header-note {
    padding:12px 14px;
    border:1px solid #fecaca;
    background:#fff1f2;
    border-radius:16px;
    color:#7f1d1d;
    font-weight:800;
    line-height:1.55;
    box-shadow:var(--shadow-soft);
  }
  .app-main {
    max-width:1280px;
    margin:0 auto 40px;
    padding:0 20px 24px;
    display:grid;
    grid-template-columns:minmax(0,1fr) 380px;
    gap:18px;
    align-items:start;
  }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); }
  .viewer { padding:14px; }
  .viewer-top {
    display:flex;
    gap:12px;
    justify-content:space-between;
    align-items:flex-end;
    padding:2px 2px 12px;
  }
  .viewer-title { display:flex; flex-direction:column; gap:2px; }
  .viewer-title strong { font-size:17px; }
  .viewer-title small { color:var(--muted); line-height:1.45; }
  .quick-status { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .pill {
    display:inline-flex;
    align-items:center;
    min-height:28px;
    padding:4px 9px;
    border-radius:999px;
    background:var(--soft2);
    border:1px solid #e2e8f0;
    color:#334155;
    font-size:12px;
    font-weight:800;
    white-space:nowrap;
  }
  .map-wrap { position:relative; width:100%; overflow:hidden; border-radius:18px; border:1px solid var(--line); background:white; touch-action:none; user-select:none; }
  .map-wrap img { display:block; width:100%; height:auto; user-select:none; -webkit-user-drag:none; }
  .map-layer { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #routeOverlay { opacity:0; mix-blend-mode:normal; transition:opacity .15s ease; }
  #drawCanvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair; z-index:3; }
  #answerPathCanvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:4; }
  .route-data-box { width:100%; min-height:74px; resize:vertical; border:1px solid var(--line); border-radius:12px; padding:8px 10px; font:12px ui-monospace,SFMono-Regular,Menlo,monospace; color:#334155; background:#fff; }
  .route-registering #drawCanvas { cursor:copy; }
  .route-registering .marker { pointer-events:none; opacity:.70; }
  .replay-bike { position:absolute; left:0; top:0; width:42px; height:30px; z-index:6; display:none; pointer-events:none; transform:translate(-50%,-50%); transform-origin:center center; filter:drop-shadow(0 3px 5px rgba(0,0,0,.28)); }
  .replay-bike.user-bike { width:38px; height:28px; z-index:7; filter:drop-shadow(0 3px 6px rgba(22,101,52,.34)); }
  .replay-bike.show { display:block; }
  .replay-bike svg { display:block; width:100%; height:100%; overflow:visible; }
  .marker { position:absolute; transform:translate(-50%,-50%); z-index:5; display:block; pointer-events:none; cursor:default; touch-action:none; }
  .marker .dot { width:22px; height:22px; border-radius:999px; border:3px solid white; box-shadow:0 0 0 3px var(--blue),0 3px 10px rgba(0,0,0,.25); background:var(--blue); }
  .marker.dragging { cursor:default; }
  .marker span { position:absolute; left:26px; top:50%; transform:translateY(-50%); white-space:nowrap; background:white; border:1px solid var(--line); border-radius:999px; padding:4px 9px; font-weight:900; font-size:12px; box-shadow:0 2px 8px rgba(0,0,0,.12); }
  .side {
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:12px;
    height:max-content;
    position:sticky;
    top:12px;
  }
  .control-section {
    border:1px solid #e5e7eb;
    background:var(--soft);
    border-radius:18px;
    padding:12px;
    display:grid;
    gap:10px;
  }
  .control-section.primary-panel { background:#ffffff; }
  .control-section.replay-panel { background:var(--blue-soft); border-color:#bfdbfe; }
  .mode-switch-panel { background:#ffffff; border-color:#cbd5e1; }
  .app-mode-tabs { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .app-mode-tabs button { min-height:54px; padding:9px 8px; line-height:1.25; }
  .app-mode-tabs button span { display:block; font-size:11px; font-weight:800; opacity:.75; margin-top:2px; }
  .app-mode-tabs button.active { background:var(--ink); color:white; border-color:var(--ink); box-shadow:0 7px 15px rgba(15,23,42,.16); }
  .app-mode-hint { border-radius:13px; padding:9px 10px; background:#f8fafc; border:1px solid #e2e8f0; color:#475569; font-size:12px; line-height:1.55; font-weight:750; }
  .app-panel { display:none; }
  body[data-app-mode="practice"] .app-panel-practice,
  body[data-app-mode="answer"] .app-panel-answer,
  body[data-app-mode="route"] .app-panel-route { display:grid; }
  body[data-app-mode="practice"] .viewer-title small::after { content:' 現在は「練習」モードです。'; }
  body[data-app-mode="answer"] .viewer-title small::after { content:' 現在は「答え」モードです。'; }
  body[data-app-mode="route"] .viewer-title small::after { content:' 現在は「ルート」モードです。'; }
  .status-panel { background:#ffffff; }
  .comparison-legend { display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:13px; font-weight:900; color:#334155; }
  .legend-pill { display:inline-flex; align-items:center; gap:6px; padding:5px 9px; border:1px solid #e2e8f0; border-radius:999px; background:white; }
  .legend-dot { width:11px; height:11px; border-radius:999px; display:inline-block; box-shadow:0 0 0 2px white,0 0 0 3px #e2e8f0; }
  .legend-dot.answer { background:#dc2626; }
  .legend-dot.user { background:#16a34a; }
  .section-head { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .section-label {
    color:#0f172a;
    font-weight:950;
    font-size:13px;
    letter-spacing:.04em;
  }
  .section-help { color:var(--muted); font-size:12px; line-height:1.55; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .row.nowrap { flex-wrap:nowrap; }
  .row > button { flex:1 1 auto; }
  select,button,input[type="range"] { font:inherit; }
  select,button {
    border-radius:14px;
    border:1px solid var(--line);
    background:white;
    color:var(--ink);
    padding:11px 13px;
    min-height:46px;
  }
  select { width:100%; min-width:0; font-weight:800; }
  button { cursor:pointer; font-weight:900; transition:transform .04s ease, box-shadow .12s ease, background .12s ease; }
  button:hover { box-shadow:0 7px 15px rgba(15,23,42,.08); }
  button:active { transform:translateY(1px); }
  button.primary { background:var(--ink); color:white; border-color:var(--ink); }
  button.accent { background:var(--accent); color:white; border-color:var(--accent); }
  button.blue { background:var(--blue); color:white; border-color:var(--blue); }
  button.ghost { background:#fff; }
  button.active { background:var(--ink); color:white; border-color:var(--ink); }
  button.full { width:100%; }
  .mode-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .status { border:1px solid #dbeafe; border-radius:16px; padding:12px; background:#ffffff; line-height:1.55; }
  .big { font-size:22px; font-weight:950; line-height:1.25; }
  .hint { font-size:14px; color:var(--muted); margin-top:4px; }
  .notes { font-size:14px; line-height:1.75; color:#374151; }
  .notes strong { color:#111827; }
  details.help-card { border:1px solid var(--line); border-radius:16px; padding:10px 12px; background:#ffffff; }
  details.help-card[open] { background:#fbfdff; }
  summary { cursor:pointer; font-weight:950; }
  ul { margin:8px 0 0; padding-left:1.2em; }
  li { margin:.25em 0; }
  .mini { font-size:12px; color:var(--muted); line-height:1.7; padding:0 2px; }
  .shortcut-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .slider-row { display:grid; grid-template-columns:82px 1fr 48px; gap:8px; align-items:center; font-size:13px; }
  .slider-row > div:first-child { font-weight:850; color:#334155; }
  input[type="range"] { width:100%; accent-color:var(--blue); }
  .kbd { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; border:1px solid var(--line); border-bottom-width:2px; border-radius:7px; padding:1px 6px; background:white; color:#374151; font-weight:900; }
  .map-bike-controls {
    margin-top:10px;
    border:1px solid #fecaca;
    background:linear-gradient(180deg,#fff7f7 0%,#ffffff 100%);
    border-radius:18px;
    padding:12px;
    display:none;
    gap:10px;
    box-shadow:var(--shadow-soft);
  }
  body[data-app-mode="answer"] .map-bike-controls { display:grid; }
  .map-bike-head {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .map-bike-head strong { font-size:15px; font-weight:950; color:#7f1d1d; }
  .mini-status {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:28px;
    padding:4px 10px;
    border-radius:999px;
    background:#fff;
    border:1px solid #fecaca;
    color:#991b1b;
    font-size:12px;
    font-weight:900;
    white-space:nowrap;
  }
  .map-bike-buttons { display:grid; grid-template-columns:1.4fr 1fr; gap:8px; }
  .map-bike-buttons button { min-height:50px; font-size:15px; }
  .map-bike-controls > button.full { min-height:46px; font-size:14px; }
  .map-bike-controls > button.full.active { background:var(--accent); color:white; border-color:var(--accent); }
  .map-bike-speed { display:grid; grid-template-columns:82px 1fr 48px; gap:8px; align-items:center; font-size:13px; }
  .map-bike-speed > div:first-child { font-weight:850; color:#7f1d1d; }
  .map-bike-note { font-size:12px; color:#7f1d1d; line-height:1.55; }

  .quick-mode-bar {
    max-width:1280px;
    margin:0 auto 14px;
    padding:0 20px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .quick-mode-card {
    min-height:70px;
    border-radius:18px;
    border:1px solid #cbd5e1;
    background:rgba(255,255,255,.92);
    box-shadow:var(--shadow-soft);
    display:grid;
    grid-template-columns:auto 1fr;
    grid-template-areas:"num title" "num text";
    align-items:center;
    column-gap:10px;
    text-align:left;
    padding:12px 14px;
  }
  .quick-mode-card:hover { box-shadow:0 10px 22px rgba(15,23,42,.12); }
  .quick-mode-card.active {
    background:#0f172a;
    color:white;
    border-color:#0f172a;
  }
  .quick-mode-number {
    grid-area:num;
    width:34px;
    height:34px;
    border-radius:999px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-weight:950;
    background:#e0f2fe;
    color:#0369a1;
  }
  .quick-mode-card.active .quick-mode-number { background:white; color:#0f172a; }
  .quick-mode-card strong { grid-area:title; font-size:15px; line-height:1.15; }
  .quick-mode-card small { grid-area:text; font-size:12px; color:var(--muted); font-weight:850; }
  .quick-mode-card.active small { color:#cbd5e1; }
  .map-guide {
    display:grid;
    grid-template-columns:auto auto 1fr;
    gap:8px;
    align-items:center;
    margin:0 2px 10px;
    padding:10px 12px;
    border-radius:16px;
    border:1px solid #dbeafe;
    background:linear-gradient(180deg,#eff6ff 0%,#ffffff 100%);
    color:#1e3a8a;
    font-size:13px;
    line-height:1.45;
  }
  .map-guide > div {
    padding:3px 8px;
    border-radius:999px;
    background:#dbeafe;
    color:#1d4ed8;
    font-size:11px;
    font-weight:950;
    white-space:nowrap;
  }
  .map-guide strong { font-size:14px; font-weight:950; white-space:nowrap; }
  .map-guide span { color:#334155; font-weight:750; }
  .side .control-section { box-shadow:0 5px 14px rgba(15,23,42,.05); }
  .control-section.status-panel { border-color:#bfdbfe; background:#ffffff; }
  .control-section.status-panel .status { background:#f8fafc; border-color:#e2e8f0; }
  .app-panel-answer { border-color:#fecaca; background:#fff7f7; }
  .app-panel-route { border-color:#bbf7d0; background:#f0fdf4; }
  .app-panel-practice { border-color:#bfdbfe; }
  .mode-switch-panel { border-width:2px; }
  .mode-switch-panel .section-label::before { content:'🧭 '; }
  .primary-panel .section-label::before { content:'🏍️ '; }
  .status-panel .section-label::before { content:'📌 '; }
  .app-panel-practice .section-label::before { content:'✍️ '; }
  .app-panel-answer .section-label::before { content:'🔍 '; }
  .app-panel-route .section-label::before { content:'📄 '; }
  button.blue, button.accent, button.primary { box-shadow:0 8px 18px rgba(15,23,42,.14); }
  .map-bike-controls { border-width:2px; }
  .map-bike-head strong::before { content:'🏁 '; }

  @media (max-width:980px) {
    .app-header { grid-template-columns:1fr; padding-inline:14px; }
    .quick-mode-bar { padding-inline:14px; }
    .app-main { grid-template-columns:1fr; padding-inline:14px; }
    .side { position:static; }
    .viewer-top { flex-direction:column; align-items:flex-start; }
    .quick-status { justify-content:flex-start; }
  }
  @media (max-width:560px) {
    .app-header { padding-top:12px; padding-bottom:8px; }
    h1 { font-size:24px; }
    .quick-mode-bar {
      position:sticky;
      top:0;
      z-index:40;
      grid-template-columns:repeat(3,1fr);
      gap:6px;
      padding:8px 10px;
      margin-bottom:8px;
      background:rgba(238,242,247,.94);
      backdrop-filter:blur(8px);
    }
    .quick-mode-card {
      min-height:58px;
      border-radius:14px;
      padding:8px 6px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      gap:2px;
    }
    .quick-mode-number { width:24px; height:24px; font-size:12px; }
    .quick-mode-card strong { font-size:12px; }
    .quick-mode-card small { display:none; }
    .app-main { gap:12px; }
    .viewer, .side { padding:10px; }
    .card { border-radius:18px; }
    .mode-grid { grid-template-columns:1fr; }
    .app-mode-tabs { grid-template-columns:1fr; }
    .app-mode-tabs button { min-height:48px; }
    .row.nowrap { flex-wrap:wrap; }
    .slider-row { grid-template-columns:74px 1fr 44px; font-size:12px; }
    select,button { min-height:44px; padding:10px 11px; }
    .app-header { padding-inline:10px; }
    .header-note { font-size:12px; padding:10px 12px; border-radius:14px; }
    .sub { font-size:13px; }
    .quick-status { gap:4px; }
    .pill { font-size:11px; min-height:24px; padding:3px 7px; }
    .map-guide { grid-template-columns:1fr; gap:4px; font-size:12px; padding:9px 10px; }
    .map-guide > div { width:max-content; }
    .map-wrap { border-radius:14px; }
    .map-bike-controls { position:sticky; bottom:8px; z-index:20; margin-top:8px; padding:10px; border-radius:16px; }
    .map-bike-buttons { grid-template-columns:1fr 1fr; }
    .map-bike-buttons button { min-height:54px; font-size:15px; }
    .map-bike-speed { grid-template-columns:74px 1fr 44px; font-size:12px; }
    .control-section { border-radius:16px; padding:10px; }
    .status { padding:10px; }
    .big { font-size:19px; }
    .hint, .notes { font-size:13px; }

  }



  /* simple UI overrides */
  .simple-header { display:block; padding:12px 14px 6px; }
  .simple-header h1 { margin:0; font-size:24px; }
  .simple-header .eyebrow { margin:0 0 2px; font-size:12px; }
  .simple-mode-bar { margin:0 auto 8px; gap:6px; }
  .quick-mode-card { min-height:46px; border-radius:14px; padding:8px 10px; grid-template-areas:"num title"; }
  .quick-mode-card small { display:none; }
  .quick-mode-number { width:26px; height:26px; font-size:12px; }
  .quick-mode-card strong { font-size:15px; }
  .simple-viewer-top { padding:0 2px 8px; }
  .viewer-title small, .quick-status, .map-guide, .side .mode-switch-panel, .help-card, .map-bike-note { display:none !important; }
  .app-main { gap:12px; }
  .viewer { padding:10px; }
  .side { gap:8px; padding:10px; }
  .control-section { padding:10px; gap:8px; border-radius:15px; }
  .section-head { min-height:0; }
  .section-label { font-size:14px; }
  .status { padding:9px 10px; }
  .big { font-size:18px; }
  .hint { font-size:12px; line-height:1.45; margin-top:2px; }
  select, button { min-height:42px; padding:9px 11px; border-radius:12px; }
  .map-bike-controls { padding:10px; gap:8px; }
  .map-bike-buttons button { min-height:46px; }
  .mini { font-size:12px; line-height:1.4; }
  @media (max-width:560px) {
    .simple-header { padding:10px 10px 4px; }
    .simple-header h1 { font-size:21px; }
    .simple-mode-bar { position:sticky; top:0; z-index:30; padding:6px 10px; background:rgba(248,250,252,.96); backdrop-filter:blur(8px); }
    .quick-mode-card { min-height:44px; border-radius:12px; padding:7px 8px; }
    .app-main { padding-inline:10px; }
    .viewer, .side { padding:8px; }
    .control-section { padding:9px; }
    .map-bike-controls { bottom:6px; }
  }

</style>
</head>
<body data-app-mode="practice">
<header class="app-header simple-header">
  <div>
    <p class="eyebrow">大型二輪コース暗記ツール</p>
    <h1>コース暗記</h1>
  </div>
</header>
<nav class="quick-mode-bar simple-mode-bar" aria-label="操作モード">
  <button type="button" class="quick-mode-card active" data-mode-target="practice"><span class="quick-mode-number">1</span><strong>練習</strong></button>
  <button type="button" class="quick-mode-card" data-mode-target="answer"><span class="quick-mode-number">2</span><strong>答え</strong></button>
  <button type="button" class="quick-mode-card" data-mode-target="route"><span class="quick-mode-number">3</span><strong>読込</strong></button>
</nav>
<main class="app-main">
  <section class="card viewer">
    <div class="viewer-top simple-viewer-top">
      <div class="viewer-title">
        <strong>コース図</strong>
      </div>
    </div>
      <strong id="mapGuideTitle">練習</strong>
      <span id="mapGuideText">地図上をドラッグして、覚えている走行ラインを描きます。</span>
    </div>
    <div class="map-wrap" id="mapWrap" aria-label="大型二輪コース図">
      <img id="baseImg" alt="赤線を消した大型二輪コース図">
      <img id="routeOverlay" class="map-layer" alt="公式赤線">
      <canvas id="drawCanvas" aria-label="走行ラインをなぞるキャンバス"></canvas>
      <canvas id="answerPathCanvas" aria-label="答えルート中の確認表示"></canvas>
      <div id="replayBike" class="replay-bike" aria-hidden="true">
        <svg viewBox="0 0 64 40" role="img" focusable="false">
          <circle cx="15" cy="29" r="8" fill="#111827"/>
          <circle cx="15" cy="29" r="4" fill="#f9fafb"/>
          <circle cx="49" cy="29" r="8" fill="#111827"/>
          <circle cx="49" cy="29" r="4" fill="#f9fafb"/>

function loadStartMarkerPositions() {
  try {
    const raw = localStorage.getItem(START_MARKER_STORAGE_KEY);
    if(!raw) return structuredClone(DEFAULT_START_MARKER_POSITIONS);
    const parsed = JSON.parse(raw);
    const merged = structuredClone(DEFAULT_START_MARKER_POSITIONS);
    for(const key of Object.keys(merged)) {
      if(parsed[key] && Number.isFinite(parsed[key].x) && Number.isFinite(parsed[key].y)) {
        merged[key] = {
          x: Math.max(0, Math.min(100, parsed[key].x)),
          y: Math.max(0, Math.min(100, parsed[key].y))
        };
      }
    }
    return merged;
  } catch(_) {
    return structuredClone(DEFAULT_START_MARKER_POSITIONS);
  }
}
function saveStartMarkerPositions() {
  try {
    localStorage.setItem(START_MARKER_STORAGE_KEY, JSON.stringify(startMarkerPositions));
  } catch(_) {}
}
function applyStartMarkerPosition() {
  const pos = startMarkerPositions[courseKey] || DEFAULT_START_MARKER_POSITIONS[courseKey] || { x: 82.2, y: 63.0 };
  startMarker.style.left = pos.x.toFixed(2) + '%';
  startMarker.style.top = pos.y.toFixed(2) + '%';
}
function markerPointFromEvent(e) {
  const rect = mapWrap.getBoundingClientRect();
  const x = Math.max(0, Math.min(100, (e.clientX - rect.left) / rect.width * 100));
  const y = Math.max(0, Math.min(100, (e.clientY - rect.top) / rect.height * 100));
  return { x, y };
}
function updateStartMarkerFromEvent(e, save=false) {
  const pos = markerPointFromEvent(e);
  startMarkerPositions[courseKey] = pos;
  applyStartMarkerPosition();
  if(save) saveStartMarkerPositions();
}
function resetStartMarkerPosition() {
  applyStartMarkerPosition();
  statusTitle.textContent = '発着点はメモ指定';
  statusHint.textContent = '発着点はメモファイルの start で固定します。変更する場合は answer_route_memo.json を編集して再読込してください。';
}

function normalizeRoutePoints(points) {
  if(!Array.isArray(points)) return [];
  return points
    .map(p => Array.isArray(p) ? { x:Number(p[0]), y:Number(p[1]) } : { x:Number(p.x), y:Number(p.y) })
    .filter(p => Number.isFinite(p.x) && Number.isFinite(p.y))
    .map(p => ({ x: Math.max(0, Math.min(100, p.x)), y: Math.max(0, Math.min(100, p.y)) }));
}
function loadAnswerBikeRoutes() {
  try {
    const raw = localStorage.getItem(ANSWER_ROUTE_STORAGE_KEY);
    if(!raw) return { course1: [], course2: [] };
    const parsed = JSON.parse(raw);
    return {
      course1: normalizeRoutePoints(parsed.course1),
      course2: normalizeRoutePoints(parsed.course2)
    };
  } catch(_) {
    return { course1: [], course2: [] };
  }
}
function saveAnswerBikeRoutes() {
  try {
    localStorage.setItem(ANSWER_ROUTE_STORAGE_KEY, JSON.stringify(answerBikeRoutes));
  } catch(_) {}
}
function routePointFromEvent(e) {
  const rect = mapWrap.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(100, (e.clientX - rect.left) / rect.width * 100)),
    y: Math.max(0, Math.min(100, (e.clientY - rect.top) / rect.height * 100))
  };
}
function clearAnswerPathCanvas() {
  answerPathCtx.save();
  answerPathCtx.setTransform(1,0,0,1,0,0);
  answerPathCtx.clearRect(0, 0, answerPathCanvas.width, answerPathCanvas.height);
  answerPathCtx.restore();
}
function activeAnswerRoutePoints() {
  if(answerRouteEditMode && answerRouteDraft) return answerRouteDraft;
  return answerBikeRoutes[courseKey] || [];
}
function drawAnswerRoutePreview(force=false) {
  clearAnswerPathCanvas();
  // メイン画面の「答え確認」では、公式の赤線画像だけを見せる。
  // 登録済みルートの緑線・緑点は、登録作業中だけ表示する。
  if(!answerRouteEditMode) return;
  const points = activeAnswerRoutePoints();
  const rect = mapWrap.getBoundingClientRect();
  if(rect.width <= 0 || rect.height <= 0 || !points.length) return;
  answerPathCtx.save();
  answerPathCtx.lineCap = 'round';
  answerPathCtx.lineJoin = 'round';
  answerPathCtx.strokeStyle = 'rgba(22,163,74,.90)';
  answerPathCtx.lineWidth = 4;
  answerPathCtx.beginPath();
  points.forEach((p, i) => {
    const x = p.x / 100 * rect.width;
    const y = p.y / 100 * rect.height;
    if(i === 0) answerPathCtx.moveTo(x, y);
    else answerPathCtx.lineTo(x, y);
  });
  if(points.length > 1) answerPathCtx.stroke();
  points.forEach((p, i) => {
    const x = p.x / 100 * rect.width;
    const y = p.y / 100 * rect.height;
    answerPathCtx.beginPath();
    answerPathCtx.fillStyle = i === 0 ? 'rgba(37,99,235,.95)' : 'rgba(22,163,74,.95)';
    answerPathCtx.strokeStyle = '#ffffff';
    answerPathCtx.lineWidth = 2;
    answerPathCtx.arc(x, y, i === 0 ? 6 : 4, 0, Math.PI * 2);
    answerPathCtx.fill();
    answerPathCtx.stroke();
  });
  answerPathCtx.restore();
}
function updateAnswerRouteStatus() {
  const saved = answerBikeRoutes[courseKey] || [];
  const draft = answerRouteDraft || [];
  const start = startMarkerPositions[courseKey] || DEFAULT_START_MARKER_POSITIONS[courseKey] || { x:82.2, y:63.0 };
  if(answerRouteEditMode) {
    if(routePointStatus) routePointStatus.textContent = '登録中: ' + draft.length + '点。赤線上を進行順にタップしてください。';
    if(routeEditBtn) routeEditBtn.textContent = '登録中止';
    mapWrap.classList.add('route-registering');
  } else {
    const startText = '発着点 ' + Number(start.x).toFixed(1) + ',' + Number(start.y).toFixed(1);
    if(routePointStatus) routePointStatus.textContent = saved.length >= 2 ? ('登録済み: ' + saved.length + '点 / ' + startText) : '未登録 / ' + startText;
    if(routeEditBtn) routeEditBtn.textContent = '登録開始';
    mapWrap.classList.remove('route-registering');
  }
}
function startAnswerRouteEdit() {
  stopAnswerBike();
  stopReplay(true);
  clearVisibleCanvas();
  displayMode = 'answer';
  answerForced = true;
  opacitySlider.value = 100;
  updateView();
  const start = startMarkerPositions[courseKey] || DEFAULT_START_MARKER_POSITIONS[courseKey] || { x:82.2, y:63.0 };
  const existing = answerBikeRoutes[courseKey] || [];
  answerRouteDraft = existing.length >= 2 ? existing.map(p => ({...p})) : [{ x:start.x, y:start.y }];
  answerRouteEditMode = true;
  updateAnswerRouteStatus();
  drawAnswerRoutePreview(true);
  statusTitle.textContent = '答えルート中';
  statusHint.textContent = '登録中は地図をタップすると緑の点が追加されます。ドラッグではなく、曲がり角や交差の手前・直進先を順番にタップしてください。';
}
function cancelAnswerRouteEdit() {
  if(!answerRouteEditMode) return;
  answerRouteEditMode = false;
  answerRouteDraft = null;
  clearAnswerPathCanvas();
  updateAnswerRouteStatus();
  updateView();
}
function addAnswerRoutePointFromEvent(e) {
  if(!answerRouteEditMode) return;
  e.preventDefault();
  e.stopPropagation();
  const p = routePointFromEvent(e);
  answerRouteDraft.push(p);
  updateAnswerRouteStatus();
  drawAnswerRoutePreview(true);
}
function undoAnswerRoutePoint() {
  if(answerRouteEditMode && answerRouteDraft) {
    if(answerRouteDraft.length > 1) answerRouteDraft.pop();
    updateAnswerRouteStatus();
    drawAnswerRoutePreview(true);
    return;
  }
  const saved = answerBikeRoutes[courseKey] || [];
  if(saved.length > 0) {
    saved.pop();
    answerBikeRoutes[courseKey] = saved;
    saveAnswerBikeRoutes();
  }
  updateAnswerRouteStatus();
}
function saveAnswerRouteDraft(startPlayback=true) {
  if(!answerRouteEditMode || !answerRouteDraft) {
    statusTitle.textContent = '登録中ではありません';
    statusHint.textContent = '先に「登録開始」を押して、赤線上を順番にタップしてください。';
    return;
  }
  if(answerRouteDraft.length < 2) {
    statusTitle.textContent = '登録点が足りません';
    statusHint.textContent = '発着点のほかに、赤線上の通過点を最低1点以上タップしてください。';
    return;
  }

  showReplayBikeAt(p.x * rect.width, p.y * rect.height, p.angle);

  if(answerUserBikeRouteCache) {
    const up = userDrawnBikePointAt(answerUserBikeRouteCache, Math.min(elapsedMs || 0, answerUserBikeRouteCache.duration));
    if(up) showUserReplayBikeAt(up.x * rect.width, up.y * rect.height, up.angle);
    else hideUserReplayBike();
  } else {
    hideUserReplayBike();
  }
}
function updateAnswerBikeControlUi() {
  const running = answerBikeRaf !== null;
  const paused = !!answerBikeRouteCache && answerBikePaused;
  const finished = answerBikeFinished;
  const hasRegisteredRoute = (answerBikeRoutes[courseKey] || []).length >= 2 || (ANSWER_BIKE_ROUTE_PERCENT[courseKey] || []).length >= 2;
  if(answerBikePlayPauseBtn) {
    answerBikePlayPauseBtn.textContent = running ? '一時停止' : (paused ? '再開' : (finished ? 'もう一度再生' : '再生'));
    answerBikePlayPauseBtn.classList.toggle('accent', !running);
    answerBikePlayPauseBtn.classList.toggle('blue', running);
  }
  if(answerBikeEndBtn) answerBikeEndBtn.disabled = !running && !paused && !finished && !answerBikeRouteCache;
  if(answerBikeMiniStatus) {
    const twoBike = answerBikeHasUserRoute();
    answerBikeMiniStatus.textContent = running ? (twoBike ? '2台走行中' : '走行中') : (paused ? (twoBike ? '2台一時停止中' : '一時停止中') : (finished ? '完了' : (hasRegisteredRoute ? (drawnSegments.length ? '2台再生可' : '再生可') : '未登録')));
  }
}
function stopAnswerBike(hideBike = true) {
  if(answerBikeRaf !== null) cancelAnimationFrame(answerBikeRaf);
  answerBikeRaf = null;
  answerBikeBaseTime = 0;
  answerBikeRouteCache = null;
  answerUserBikeRouteCache = null;
  answerBikePaused = false;
  answerBikeFinished = false;

  updateAnswerBikeControlUi();
}
function finishAnswerBikePlayback() {
  if(answerBikeRaf !== null) cancelAnimationFrame(answerBikeRaf);
  answerBikeRaf = null;
  answerBikePaused = false;
  answerBikeFinished = true;
  if(answerBikeRouteCache) {
    const duration = currentAnswerBikeSessionDuration();
    answerBikeBaseTime = duration;
    renderAnswerBikeAt(duration);
  }
  statusTitle.textContent = '答え走行完了';
  statusHint.textContent = answerBikeHasUserRoute()
    ? '公式赤線ルートのバイクと、自分で書いた線のバイクを1回再生しました。コース図下の「もう一度再生」で再確認できます。'
    : '公式赤線の走行イメージを1回再生しました。コース図下の「もう一度再生」で最初から確認できます。';
  updateAnswerBikeControlUi();
}
function runAnswerBikeLoop() {
  answerBikeStartedAt = performance.now();
  answerBikePaused = false;
  answerBikeFinished = false;
  updateAnswerBikeControlUi();
  const step = () => {
    if(!answerBikeRouteCache) {
      stopAnswerBike();
      return;
    }
    const elapsed = currentAnswerBikeElapsed();
    renderAnswerBikeAt(elapsed);
    if(elapsed >= currentAnswerBikeSessionDuration()) {
      finishAnswerBikePlayback();
      return;
    }
    answerBikeRaf = requestAnimationFrame(step);
  };
  answerBikeRaf = requestAnimationFrame(step);
}
function pauseAnswerBike() {
  if(answerBikeRaf === null || !answerBikeRouteCache) return;
  answerBikeBaseTime = Math.max(0, Math.min(currentAnswerBikeSessionDuration(), currentAnswerBikeElapsed()));
  cancelAnimationFrame(answerBikeRaf);
  answerBikeRaf = null;
  answerBikePaused = true;
  answerBikeFinished = false;
  renderAnswerBikeAt(answerBikeBaseTime);
  statusTitle.textContent = '答え走行一時停止';
  statusHint.textContent = 'コース図下の「再開」を押すと、この位置からバイク走行を続けます。';
  updateAnswerBikeControlUi();
}
function resumeAnswerBike() {
  if(!answerBikeRouteCache) {
    startAnswerBike();
    return;
  }
  if(answerBikeBaseTime >= currentAnswerBikeSessionDuration() - 20) answerBikeBaseTime = 0;
  statusTitle.textContent = '答え走行中';
  statusHint.textContent = answerBikeHasUserRoute()
    ? '公式赤線ルートのバイクと、自分で書いた線を走るバイクの2台を同時に走らせています。コース図下で一時停止・終了・赤線ON/OFFができます。'
    : '公式赤線を表示しています。バイク走行はそのまま続きます。コース図下で一時停止・終了・赤線ON/OFFができます。';
  runAnswerBikeLoop();
}
function endAnswerBikePlayback(showStatus = true) {
  stopAnswerBike(true);
  if(showStatus) {
    statusTitle.textContent = '答え走行を終了';
    statusHint.textContent = 'バイク走行を終了しました。公式赤線の表示状態はそのままです。';
  }
}
function toggleAnswerBikePlayPause() {
  stopReplay(true);
  if(answerBikeRaf !== null) {
    pauseAnswerBike();
    return;
  }
  if(answerBikeRouteCache && answerBikePaused) {
    resumeAnswerBike();
    return;
  }
  startAnswerBike();
}
function startAnswerBike() {
  stopReplay(true);
  stopAnswerBike(false);
  clearAnswerPathCanvas();
  displayMode = 'answer';
  answerForced = true;
  opacitySlider.value = 100;
  updateView();
  answerBikeRouteCache = buildAnswerBikeRoute();
  answerUserBikeRouteCache = buildUserDrawnBikeRoute();
  if(!answerBikeRouteCache) {
    answerUserBikeRouteCache = null;
    statusTitle.textContent = '答えルート未登録';
    statusHint.textContent = '先にルートモードでメモファイルを読み込んでください。';
    hideReplayBike();
    updateAnswerBikeControlUi();
    return;
  }
  answerBikeBaseTime = 0;
  renderAnswerBikeAt(0);
  statusTitle.textContent = '答え走行中';
  statusHint.textContent = answerBikeHasUserRoute()
    ? '公式赤線ルートのバイクと、自分で書いた線を走るバイクの2台を同時に走らせています。コース図下で一時停止・終了・赤線ON/OFFができます。'
    : '公式赤線を表示しています。バイク走行はそのまま続きます。コース図下で一時停止・終了・赤線ON/OFFができます。';
  runAnswerBikeLoop();
}
function replayDuration() {
  if(!drawnSegments.length) return 0;
  return drawnSegments.reduce((m, seg) => Math.max(m, seg.t2 || 0), 0);
}
function formatReplayTime(ms) {
  if(!Number.isFinite(ms) || ms <= 0) return '0:00.0';
  const totalTenths = Math.floor(ms / 100);
  const minutes = Math.floor(totalTenths / 600);
  const seconds = Math.floor((totalTenths % 600) / 10);
  const tenths = totalTenths % 10;
  return minutes + ':' + String(seconds).padStart(2, '0') + '.' + tenths;
}
function updateReplayUi(ms) {
  const duration = replayDuration();
  const t = Math.max(0, Math.min(duration, ms || 0));
  replaySlider.value = duration ? Math.round(t / duration * 1000) : 1000;
  replayTimeVal.textContent = duration ? (formatReplayTime(t) + ' / ' + formatReplayTime(duration)) : '-';
}
function setReplaySpeed(value = replaySpeedSlider.value) {
  const v = Math.max(25, Math.min(300, Number(value) || 100));
  replaySpeedSlider.value = v;
  replaySpeedVal.textContent = (v / 100).toFixed(1) + 'x';
}
function hideBikeElement(bikeEl) {
  if(bikeEl) bikeEl.classList.remove('show');
}
function hideReplayBike() {
  hideBikeElement(replayBike);
  hideBikeElement(userReplayBike);
}
function showBikeElementAt(bikeEl, x, y, angleDeg) {
  if(!bikeEl) return;
  if(!Number.isFinite(x) || !Number.isFinite(y)) {
    hideBikeElement(bikeEl);
    return;
  }
  bikeEl.style.left = x + 'px';
  bikeEl.style.top = y + 'px';
  bikeEl.style.transform = 'translate(-50%,-50%) rotate(' + (Number.isFinite(angleDeg) ? angleDeg : 0) + 'deg)';
  bikeEl.classList.add('show');
}
function showReplayBikeAt(x, y, angleDeg) {
  showBikeElementAt(replayBike, x, y, angleDeg);
}
function showUserReplayBikeAt(x, y, angleDeg) {
  showBikeElementAt(userReplayBike, x, y, angleDeg);
}
function hideUserReplayBike() {
  hideBikeElement(userReplayBike);
}
function renderReplayAt(ms, options = {}) {
  const rect = drawCanvas.getBoundingClientRect();
  if(rect.width <= 0 || rect.height <= 0) {
    hideReplayBike();
    return;
  }
  const showBike = !!options.showBike;
  const duration = replayDuration();
  const t = Math.max(0, Math.min(duration, ms || 0));
  clearVisibleCanvas();
  let bikeState = null;
  for(const seg of drawnSegments) {
    const t1 = seg.t1 || 0;
    const t2 = Math.max(t1, seg.t2 || t1);
    const sx = seg.x1 * rect.width;
    const sy = seg.y1 * rect.height;
    const exFull = seg.x2 * rect.width;
    const eyFull = seg.y2 * rect.height;
    const angle = Math.atan2(eyFull - sy, exFull - sx) * 180 / Math.PI;
    if(t < t1) {
      if(!bikeState) bikeState = { x: sx, y: sy, angle };
      break;
    }
    const r = t2 === t1 ? 1 : Math.max(0, Math.min(1, (t - t1) / (t2 - t1)));
    const x2 = sx + (exFull - sx) * r;
    const y2 = sy + (eyFull - sy) * r;
    bikeState = { x: x2, y: y2, angle };
    if(t < t2) break;
  }
  if(showBike && bikeState) showReplayBikeAt(bikeState.x, bikeState.y, bikeState.angle);
  else hideReplayBike();
  updateReplayUi(t);
}
function stopReplay(restoreCanvas = true) {
  if(replayRaf !== null) cancelAnimationFrame(replayRaf);
  replayRaf = null;
  replayBtn.textContent = '時系列再生';
  exitReplayMode(restoreCanvas);
  hideReplayBike();
}
function finishReplay() {
  if(replayRaf !== null) cancelAnimationFrame(replayRaf);
  replayRaf = null;
  replayBtn.textContent = '時系列再生';
  exitReplayMode(false);
  displayMode = 'answer';
  answerForced = true;
  opacitySlider.value = 100;
  updateView();
  redrawDrawingFromSegments();
  hideReplayBike();
  updateReplayUi(replayDuration());
}
function pauseReplay() {
  if(replayRaf !== null) cancelAnimationFrame(replayRaf);
  replayRaf = null;
  replayBtn.textContent = '時系列再生';
}
function startReplay() {
  stopAnswerBike();
  const duration = replayDuration();
  if(!duration) {
    statusTitle.textContent = '再生できません';
    statusHint.textContent = '先に地図上をドラッグして、自分の走行ラインを描いてください。';
    updateReplayUi(0);
    return;
  }
  if(replayRaf !== null) {
    pauseReplay();
    statusTitle.textContent = '再生一時停止';
    statusHint.textContent = '公式赤線を表示したまま、バイクの位置で描いた順番を確認できます。もう一度「時系列再生」を押すと続きから再生します。';
    return;
  }
  enterReplayMode();
  const currentBySlider = Number(replaySlider.value) / 1000 * duration;
  replayBaseTime = currentBySlider >= duration - 30 ? 0 : currentBySlider;
  replayStartedAt = performance.now();
  replayBtn.textContent = '一時停止';
  statusTitle.textContent = '時系列再生中';
  statusHint.textContent = '公式赤線を表示した状態で、描いた順番どおりにバイクだけを走らせています。自分の線は再生中は表示しません。';
  const step = () => {
    const speed = Math.max(0.25, Math.min(3, Number(replaySpeedSlider.value) / 100 || 1));
    const t = replayBaseTime + (performance.now() - replayStartedAt) * speed;
    renderReplayAt(t, { showBike:true });
    if(t >= duration) {
      finishReplay();
      statusTitle.textContent = '時系列再生完了';
      statusHint.textContent = 'バイクの動きで描いた順番を確認しました。再生終了後は、書いた線と公式赤線を表示しています。';
      return;
    }
    replayRaf = requestAnimationFrame(step);
  };
  replayRaf = requestAnimationFrame(step);
}
function scrubReplay() {
  stopAnswerBike();
  const duration = replayDuration();
  if(!duration) { updateReplayUi(0); return; }
  enterReplayMode();
  const t = Number(replaySlider.value) / 1000 * duration;
  if(replayRaf !== null) {
    replayBaseTime = t;
    replayStartedAt = performance.now();
  }
  statusTitle.textContent = replayRaf !== null ? '時系列再生中' : '時系列確認中';
  statusHint.textContent = '公式赤線を表示した状態で、バイクの位置だけを時系列で確認しています。';
  renderReplayAt(t, { showBike:true });
}
function noteNewSegmentTime() {
  if(drawingStartedAt === null) drawingStartedAt = performance.now();
  return performance.now() - drawingStartedAt;
}
function resizeCanvas() {
  const rect = mapWrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const oldVisible = document.createElement('canvas');
  oldVisible.width = drawCanvas.width;
  oldVisible.height = drawCanvas.height;
  oldVisible.getContext('2d').drawImage(drawCanvas, 0, 0);
  drawCanvas.width = Math.max(1, Math.round(rect.width * dpr));
  drawCanvas.height = Math.max(1, Math.round(rect.height * dpr));
  answerPathCanvas.width = drawCanvas.width;
  answerPathCanvas.height = drawCanvas.height;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr, dpr);
  answerPathCtx.setTransform(1,0,0,1,0,0);
  answerPathCtx.scale(dpr, dpr);
  setBrushWidth();
  if(oldVisible.width && oldVisible.height) ctx.drawImage(oldVisible, 0, 0, rect.width, rect.height);
  drawAnswerRoutePreview(true);
}
function pointFromEvent(e) {
  const rect = drawCanvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
function beginDraw(e) {
  e.preventDefault();
  if(answerRouteEditMode) {
    addAnswerRoutePointFromEvent(e);
    return;
  }
  stopAnswerBike();
  stopReplay(true);
  isDrawing = true;
  currentStrokeId++;
  last = pointFromEvent(e);
  last.t = noteNewSegmentTime();
  drawCanvas.setPointerCapture(e.pointerId);
}
function moveDraw(e) {
  if(answerRouteEditMode) return;
  if(!isDrawing) return;
  e.preventDefault();
  const p = pointFromEvent(e);
  const nowT = noteNewSegmentTime();
  const rect = drawCanvas.getBoundingClientRect();
  if(rect.width > 0 && rect.height > 0) {
    drawnSegments.push({
      x1: last.x / rect.width,
      y1: last.y / rect.height,
      x2: p.x / rect.width,
      y2: p.y / rect.height,
      t1: last.t || nowT,
      t2: nowT,
      stroke: currentStrokeId
    });
  }
  fadeVisibleDrawing();
  ctx.beginPath();
  ctx.moveTo(last.x, last.y);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  last = p;
  last.t = nowT;
  updateReplayUi(replayDuration());
}
function endDraw(e) {
  if(answerRouteEditMode) return;
  isDrawing = false;
  last = null;
}
function clearDrawing(reset=true) {
  stopAnswerBike();
  stopReplay(false);
  clearVisibleCanvas();
  drawnSegments = [];
  drawingStartedAt = null;
  currentStrokeId = 0;
  updateReplayUi(0);
}
function refreshAnswerRoutesFromStorage(showMessage=false) {
  answerBikeRoutes = loadAnswerBikeRoutes();
  updateAnswerRouteStatus();
  if(showMessage) {
    const saved = answerBikeRoutes[courseKey] || [];
    statusTitle.textContent = '登録状態を更新';
    statusHint.textContent = saved.length >= 2 ? ('現在のコースは ' + saved.length + '点の答えルートが登録されています。') : '現在のコースの答えルートは未登録です。メモファイルを読み込んでください。';
  }
}
function setAnswerLineDuringBike(visible) {
  opacitySlider.value = visible ? 100 : 0;
  displayMode = 'answer';
  answerForced = true;
  updateView();
  if(answerBikeRaf !== null) {
    statusTitle.textContent = '答え走行中';
    statusHint.textContent = visible
      ? '公式赤線を表示しています。バイク走行はそのまま続きます。'
      : '公式赤線を非表示にしています。バイク走行はそのまま続きます。';
  } else if(answerBikePaused) {
    statusTitle.textContent = '答え走行一時停止';
    statusHint.textContent = visible
      ? '公式赤線を表示しています。コース図下の「再開」を押すと、この位置から続けます。'
      : '公式赤線を非表示にしています。コース図下の「再開」を押すと、この位置から続けます。';
  } else if(answerBikeFinished) {
    statusTitle.textContent = '答え走行完了';
    statusHint.textContent = visible
      ? '再生完了後も公式赤線を表示しています。'
      : '再生完了後、公式赤線を非表示にしています。';
  }
}
function toggleAnswerLineDuringBike() {
  const visible = Number(opacitySlider.value) > 0;

function toggleAnswer() {
  if(currentAppMode === 'practice' && !isAnswerBikeSessionActive()) {
    togglePracticeAnswerHint();
    return;

    toggleAnswerLineDuringBike();
    return;

  opacitySlider.value = answerForced ? 100 : 0;
  displayMode = answerForced ? 'answer' : 'memory';

  if(e.key.toLowerCase() === 'a') toggleAnswer();
